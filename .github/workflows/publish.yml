name: Publish release images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm test
        working-directory: server/src
        env:
          MONGOMS_VERSION: "7.0.14"
      - name: Build and test exactly the images to publish
        run: |
          node scripts/ops.mjs init
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "APP_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: node scripts/smoke.mjs
      - name: Authenticate and push immutable commit tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose push api web
      - if: always()
        run: docker compose down -v
